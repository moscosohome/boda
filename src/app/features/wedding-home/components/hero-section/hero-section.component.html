<section class="hero-section" aria-labelledby="hero-title">
  <div class="hero-media" aria-hidden="true">
    <div class="hero-photo-placeholder"></div>
  </div>
  <header class="hero-topline">
    <a class="hero-brand" href="#" aria-label="Cristina y Antonio, volver al inicio">
      <img src="images/logosololetras.png" alt="" width="789" height="557" />
    </a>
    <span>{{ event.dateLabel }}</span>
  </header>
  <div class="hero-content">
    <p class="hero-kicker">{{ event.dateLabel }} · {{ event.timeLabel }}</p>
    <h1 id="hero-title">Nos casamos</h1>
    <p class="hero-names">{{ event.coupleNames }}</p>
    <dl class="hero-details" aria-label="Datos principales de la boda">
      <div>
        <dt>Fecha</dt>
        <dd>{{ event.dateLabel }}</dd>
      </div>
      <div>
        <dt>Hora</dt>
        <dd>{{ event.timeLabel }}</dd>
      </div>
      <div>
        <dt>Lugar</dt>
        <dd>{{ event.venue }}</dd>
      </div>
    </dl>
  </div>
  <a class="scroll-cue" href="#intro" aria-label="Bajar a la invitación">
    <span class="scroll-cue-line"></span>
    <span class="scroll-cue-dot"></span>
  </a>
</section>
