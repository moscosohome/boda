<section id="story" class="story-section" aria-labelledby="story-title">
  <div class="section-shell story-grid">
    <div class="story-copy">
      <p class="section-kicker">Nuestra historia</p>
      <h2 id="story-title" class="section-title" data-animate="title">
        Todo empezó un 7 de septiembre de 2013
      </h2>
      <p class="section-copy">
        Nos conocimos en aquella fiesta entre amigos a finales de aquel verano de 2013. Un mensaje,
        una llamada… y aquel septiembre empezó nuestra historia.
      </p>
    </div>
    <div class="photo-grid" aria-label="Espacios reservados para fotos de Cristina & Antonio">
      @for (photo of photos; track photo.label) {
        <figure class="photo-reveal">
          <div class="photo-frame" [class.has-image]="getImageUrl(photo) && !photo.hasLoadError">
            @if (getImageUrl(photo); as imageUrl) {
              <img
                [src]="imageUrl"
                [alt]="photo.alt"
                loading="lazy"
                (error)="markImageAsUnavailable(photo)"
              />
            } @else {
              <span>{{ photo.label }}</span>
            }
          </div>
          <figcaption>{{ photo.caption }}</figcaption>

          @if (photo.instagramUrl) {
            <a
              class="proposal-video-link"
              [href]="photo.instagramUrl"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Ver el vídeo de la pedida en Instagram"
            >
              <span class="proposal-video-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="m9.5 7 7 5-7 5V7Z" />
                </svg>
              </span>
              <span class="proposal-video-copy">
                <strong>¿Quieres ver cómo fue la pedida?</strong>
                <small>Ver en Instagram</small>
              </span>
              <svg class="proposal-video-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-5-5 5 5-5 5" />
              </svg>
            </a>
          }
        </figure>
      }
    </div>
  </div>
</section>
