<section id="programa" class="timeline-section" aria-labelledby="timeline-title">
  <div class="section-shell">
    <p class="section-kicker">Programa</p>
    <h2 id="timeline-title" class="section-title" data-animate="title">Así será el gran día</h2>
    <div class="timeline-list">
      <div class="timeline-line" aria-hidden="true">
        <span class="timeline-line-fill"></span>
      </div>
      @for (item of schedule; track item.title) {
        <article class="timeline-item">
          <span class="timeline-dot" aria-hidden="true"></span>
          <div>
            <h3>{{ item.title }}</h3>
            <p>{{ item.text }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
